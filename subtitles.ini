; ============================================================================
; Half-Life Subtitles Configuration
; Changes reload automatically in-game within ~1 second (or: subtitles_reload)
; ============================================================================

[Visual]
; style=default | hl2
style=default
font_name=Tahoma
font_size=20
bottom_margin_pct=13
max_width_pct=62
max_lines=6
max_lines_per_caption=3
; bg_color=0,0,0
; bg_alpha=128
; bg_radius=8

[Filtering]
max_distance=650
glass_max_distance=320
; Minimum perceived volume at listener position (uses GoldSrc attenuation when use_attenuation_cutoff=1):
min_volume=0.10
use_attenuation_cutoff=1
check_occlusion=1
enable_vox=1
enable_hev=1
enable_npc=1
enable_sfx=1
sfx_max_distance=550
sfx_min_volume=0.22
sfx_cooldown_ms=3500
max_sfx_captions=2
; Restore unused HEV suit lines in vanilla Half-Life (auto-disabled in MMod):
restore_unused_hev=1
; Auto-measure .wav duration for third-party voiceovers (0 = use TSV timings, 1 = prefer WAV):
auto_wav_timing=0
; Optional overrides for creature SFX cooldown groups and scripted/glass no-occlusion prefixes:
; sfx_creature_groups=headcrab,zombie,bullchicken,houndeye,barnacle,aslave,agrunt,ichy,controller,garg,gonarch,tentacle,x,turret,apache,hassault,gonome,pitdrone,voltigore,shockroach,pitworm,geneworm
; no_occlusion_prefixes=sc_silo,scientist/c1a3_sci_silo,ba_tram,tram/,ba_sec,sc_sec,sc_accident,sc_canals,ro_tele_final
debug_log=0

[HUD]
; Global defaults (leave HUD untouched for vanilla valve and unknown third-party mods;
; per-mod overrides are configured below in [Mod:<gameDir>] sections)
hud_compact_armor=0
hud_scale=1.0
; Experimental OpenGL 3D projected flashlight (HL2-style cone + inertial sway)
enable_gl_flashlight=1
gl_flashlight_intensity=1.0
gl_flashlight_hide_vanilla=1

[Mod:bshift]
enable_hev=0
restore_unused_hev=0
hud_compact_armor=1
hud_scale=1.5
no_occlusion_max_distance=2000

[Mod:gearbox]
enable_hev=0
restore_unused_hev=0
hud_compact_armor=1
hud_scale=1.5
enable_gl_flashlight=0

[Mod:hl1mmod]
restore_unused_hev=0
enable_gl_flashlight=0
hud_compact_armor=0
hud_scale=1.0

[Files]
; Language: auto (detects Steam / -language / Windows) | ru | en
; To use a custom translation (e.g. subtitles_de.tsv), comment out language=auto,
; uncomment the pattern lines below, and save (or run subtitles_reload in console):
language=auto
fallback_dir=valve
; subtitles_pattern=subtitles_de.tsv
; titles_pattern=titles_de.tsv

